l_braz_por:
  trait_painted_galaxy_reserved_spawn_hide: "Hide Reserved Spawns"
  trait_painted_galaxy_reserved_spawn_hide_desc: "This trait invalidates all Reserved Spawn traits to get them out of your way. It has no gameplay effects and will be removed on game start."
  trait_painted_galaxy_reserved_spawn_desc: "This trait is used to customizing the empire spawn location in Paint a Galaxy maps, and will be automatically removed when the game starts. If the reserved solar system is not available (it was not designated in the map, or another empire with this trait spawned first), then this empire will instead spawn in a random location. Consult the specific map for which reserved spawns are used and where they are located."
  trait_painted_galaxy_reserved_spawn_sol: "Reserved Spawn Sol"
  trait_painted_galaxy_reserved_spawn_sol_desc: "$trait_painted_galaxy_reserved_spawn_desc$\n\nAn empire with this trait should also be set to use Sol (or a variant) for its starting system."
